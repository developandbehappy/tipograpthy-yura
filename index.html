<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прайс-калькулятор | Типография</title>
<style>
:root{--ink:#10231c;--accent:#0f9d78;--accent-dark:#0b7a5d;--accent-soft:#e3f7ef;--paper:#fbfaf6;--card:#fff;--line:#e4e1d6;--muted:#8b8a7f;--radius:14px;--shadow:0 10px 30px rgba(16,35,28,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;background:radial-gradient(circle at 10% 0,#eef8f2 0,transparent 45%),radial-gradient(circle at 90% 100%,#f5efe2 0,transparent 50%),var(--paper);color:var(--ink);min-height:100vh}
.shell{max-width:1320px;margin:28px auto;display:grid;grid-template-columns:230px 1fr;gap:22px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
.brand .name{font-weight:700;font-size:16px;line-height:1.1}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sidenav{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 12px;height:fit-content;position:sticky;top:24px}
.nav-scroll{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow-y:auto}
.nav-item{border:none;background:none;text-align:left;padding:11px 14px;border-radius:10px;font-size:14.5px;color:#4c4b43;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:10px}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 auto}
.nav-item:hover{background:var(--accent-soft)}
.nav-item.active{background:var(--ink);color:#fff;font-weight:700}
.nav-item.active .dot{background:var(--accent)}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px 38px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:22px}
.panel-head h1{font-size:24px;margin:0}
.panel-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.mode-toggle{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.mode-toggle button{border:none;background:none;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.mode-toggle button.active{background:var(--ink);color:#fff}
.divider{border:none;height:1px;background:var(--line);margin:0 0 20px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.res-col{position:sticky;top:24px}
@media (max-width:1000px){.work{grid-template-columns:1fr}.res-col{position:static}}
.block-title{text-transform:uppercase;font-size:11.5px;letter-spacing:.09em;color:var(--accent-dark);font-weight:700;margin:26px 0 14px;display:flex;align-items:center;gap:8px}
.block-title:first-child{margin-top:0}
.block-title::after{content:'';flex:1;height:1px;background:var(--line)}
.field{margin-bottom:18px}
.field>label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.shell{grid-template-columns:1fr}.sidenav{position:static}.nav-scroll{max-height:none;flex-direction:row;flex-wrap:wrap}.grid2{grid-template-columns:1fr}.panel{padding:20px}}
select,input[type=number],input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14.5px;color:var(--ink);background:var(--paper);outline:none;font-family:inherit}
select:focus,input:focus{border-color:var(--accent);background:#fff}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px;color:#4c4b43;font-weight:600}
.chip.active{border-color:var(--accent);background:var(--ink);color:#fff}
.qty-box input{margin-bottom:10px}
.qty-chips{display:flex;gap:8px;flex-wrap:wrap}
.qty-chips button{padding:9px 15px;border-radius:8px;border:1.5px dashed var(--line);background:#fff;cursor:pointer;font-size:13.5px;color:#4c4b43;font-weight:600}
.qty-chips button.active{border-style:solid;border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft)}
.switch-row{display:flex;align-items:center;gap:12px;margin:18px 0;cursor:pointer;user-select:none}
.switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:0 0 auto}
.switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch-row input{display:none}
.switch-row input:checked+.switch{background:var(--accent)}
.switch-row input:checked+.switch::after{left:21px}
.stxt{font-size:14.5px;font-weight:600}
.sub-options,.cond,.custom-dim{display:none}
.sub-options{margin:0 0 18px 54px;padding:14px 16px;background:var(--paper);border:1px dashed var(--line);border-radius:10px}
.sub-options.show,.cond.show{display:block}
.sub-options label{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;margin-bottom:9px;cursor:pointer}
.sub-options label:last-child{margin-bottom:0}
.sub-options small{color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:14px 16px;font-size:13.5px;color:#2d5c48;margin:10px 0 20px}
.custom-dim.show{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.type-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.type-card{border:1.5px solid var(--line);border-radius:12px;padding:14px 8px 12px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#4c4b43;background:#fff}
.type-card .ico{width:36px;height:36px;margin:0 auto 8px;border-radius:9px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:19px}
.type-card.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark)}
.type-card.active .ico{background:var(--accent);color:#fff}
.result{border-radius:14px;overflow:hidden;border:1.5px solid var(--line)}
.result-header{background:var(--ink);color:#fff;padding:14px 18px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tag{background:var(--accent);font-size:11.5px;padding:4px 10px;border-radius:999px;font-weight:700}
.rtable{width:100%;border-collapse:collapse}
.rtable th,.rtable td{padding:8px 12px;font-size:13px;border-bottom:1px solid #f0efe8;text-align:right}
.rtable th:first-child,.rtable td:first-child{text-align:left}
.rtable th{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em}
.rtable tr.sec td{background:var(--paper);color:var(--accent-dark);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.rtable tr.pick td{font-weight:700;color:var(--accent-dark);background:var(--accent-soft)}
.rinfo{padding:10px 18px;font-size:12.5px;color:var(--muted);line-height:1.5}
.rtotal{background:var(--accent-soft);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;color:var(--accent-dark)}
.rtotal+.rtotal{border-top:1px solid #cfeadf}
.rtotal .l{font-size:14px;font-weight:700}
.rtotal .big{font-size:22px;font-weight:800}
.rtotal .mid{font-size:17px;font-weight:800}
.hint{padding:12px 18px;font-size:12.5px;background:#fff7e8;color:#8a5a14}
</style>
</head>

/* ===================== ПРАЙС ===================== */

const P = PRICES;

/* ===================== ХЕЛПЕРЫ ===================== */
const $ = id => document.getElementById(id);
const fm = n => { const d = Math.abs(n) < 100 ? 2 : 0; return n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}) + ' ₽'; };
const val = id => { const e=$(id); if(!e) return ''; if(e.matches('select,input')) return e.value; const a=e.querySelector('.active'); return a ? a.dataset.val : ''; };
const num = (id,d=0) => parseFloat($(id)?.value) || d;
const chk = id => !!$(id)?.checked;
const PAP = () => Object.keys(P.paper);
const CUSTOM = 'Свой размер (мм)';
const SIZES = {"A6 (105x148)":[105,148],"A5 (148x210)":[148,210],"A4 (210x297)":[210,297],"A3 (297x420)":[297,420],"A2 (420x594)":[420,594],"A1 (594x841)":[594,841],"A0 (841x1189)":[841,1189],"90x50 мм":[90,50],"85x55 мм":[85,55],"Евробуклет (99x210)":[297,210]};
const sfOf = name => { const s=SIZES[name]; return (s ? s[0]*s[1] : num('w',210)*num('h',297)) / 1e6 / P.sheetArea; };

const sel = (id,label,opts,def) => `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option ${o===def?'selected':''}>${o}</option>`).join('')}</select></div>`;

const cards = (id,items) => `<div class="type-cards" id="${id}">${items.map((t,i)=>`<div class="type-card ${i?'':'active'}" data-val="${t[1]}"><span class="ico">${t[0]}</span>${t[1]}</div>`).join('')}</div>`;
const num_ = (id,label,v,extra='') => `<div class="field"><label>${label}</label><input type="number" id="${id}" value="${v}" ${extra}></div>`;
const cdim = (w,h) => `<div class="custom-dim" data-for="fmt" data-eq="${CUSTOM}">${num_('w','Ширина, мм',w)}${num_('h','Высота, мм',h)}</div>`;
const sw = (id,label) => `<label class="switch-row"><input type="checkbox" id="${id}"><span class="switch"></span><span class="stxt">${label}</span></label>`;
const title = t => `<div class="block-title">${t}</div>`;
const qtyField = () => `<div class="field qty-box"><label>Тираж, шт.</label><input type="number" id="qty" min="1" placeholder="Введите тираж"><div class="qty-chips">${[100,200,300,500,1000,5000].map(v=>`<button type="button" data-qv="${v}">${v}</button>`).join('')}</div></div>`;
/* Послепечатная обработка (radio=true — выбор одного вида) */
const post = (items, radio, label='Послепечатная обработка') =>
  sw('pt_chk', label) + `<div class="sub-options" data-for="pt_chk">${items.map((it,i)=>
  `<label><input type="${radio?'radio':'checkbox'}" name="pt" value="${it.price}" data-name="${it.name}" ${radio&&!i?'checked':''}>${it.name} <small>(+${it.price} ₽/шт.)</small></label>`).join('')}</div>`;
const getPost = () => chk('pt_chk') ? [...document.querySelectorAll('.sub-options input[name=pt]:checked')].map(c=>({l:c.dataset.name,v:parseFloat(c.value)})) : [];

/* ===================== ТОВАРЫ ===================== */

/* ===================== РАСЧЁТ ===================== */
let cur = null, mode = 'qty';
const tiersOf = p => P.discounts[p.id] || [];
function discountFor(qty, tiers){ for(const [min,k] of tiers) if(qty>=min) return k; return 1; }
/* Скидки: печать — полная; работы — доля скидки (workDiscountShare) */
function coefs(p, q){ const dp = discountFor(q, tiersOf(p)); return {dp, dw: 1 - (1-dp)*P.workDiscountShare}; }
const unitSum = (r,c) => r.print.reduce((s,x)=>s+x.v,0)*c.dp + r.work.reduce((s,x)=>s+x.v,0)*c.dw;

function update(){
  document.querySelectorAll('[data-for]').forEach(e=>{
    const eq = e.dataset.eq;
    e.classList.toggle('show', eq ? val(e.dataset.for)===eq : chk(e.dataset.for));
  });
  if(!cur || cur.editor) return;
  const r = cur.calc(), qty = parseInt($('qty').value)||0, q = qty||1, c = coefs(cur,q);
  const unit = unitSum(r,c), total = unit*q;
  const pct = k => Math.round((1-k)*100);
  const row = (x,k) => `<tr><td>${x.l}</td><td>${fm(x.v*k)}</td><td>${fm(x.v*k*q)}</td></tr>`;
  let html;
  if(mode==='qty'){
    const th = [...tiersOf(cur)].map(t=>t[0]).sort((a,b)=>a-b);
    const marks = [1,...th];
    html = `<table class="rtable"><thead><tr><th>Статья</th><th>За шт.</th><th>Всего</th></tr></thead><tbody>
      <tr class="sec"><td colspan="3">Печать и материалы</td></tr>${r.print.map(x=>row(x,c.dp)).join('')}
      ${r.work.length?`<tr class="sec"><td colspan="3">Работы</td></tr>${r.work.map(x=>row(x,c.dw)).join('')}`:''}</tbody></table>
      <div class="rinfo">Скидка за тираж: печать <b>−${pct(c.dp)}%</b>, работы <b>−${pct(c.dw)}%</b></div>
      <div class="rtotal"><span class="l">Цена за 1 ${cur.unit}</span><span class="mid">${fm(unit)}</span></div>
      <div class="rtotal"><span class="l">Итого за ${q} шт.</span><span class="big">${fm(total)}</span></div>
      <table class="rtable"><thead><tr><th>Тираж от</th><th>Скидка печ./раб.</th><th>Цена за шт.</th></tr></thead><tbody>
      ${marks.map((m,i)=>{const cc=coefs(cur,m),next=marks[i+1],on=q>=m&&(!next||q<next);
        return `<tr class="${on?'pick':''}"><td>${m} шт.</td><td>−${pct(cc.dp)}% / −${pct(cc.dw)}%</td><td>${fm(unitSum(r,cc))}</td></tr>`;}).join('')}</tbody></table>`;
  } else {
    html = `<table class="rtable"><thead><tr><th>Срочность</th><th>За шт.</th><th>Итого</th></tr></thead><tbody>
      ${P.urgency.map((u,i)=>`<tr class="${i?'':'pick'}"><td>${u.name}<br><small style="color:var(--muted)">${u.days}${u.mult>1?' · +'+Math.round((u.mult-1)*100)+'%':''}</small></td><td>${fm(unit*u.mult)}</td><td>${fm(total*u.mult)}</td></tr>`).join('')}</tbody></table>`;
  }
  $('res').innerHTML = `<div class="result-header"><span>${mode==='qty'?'Расчёт стоимости':'Сроки изготовления'}</span><span class="tag">${qty?qty+' шт.':'1 шт.'}</span></div>
    ${qty?'':'<div class="hint">Тираж не указан — показан расчёт на 1 шт.</div>'}${html}`;
}

/* ===================== ИНТЕРФЕЙС ===================== */
const panel = $('panel'), nav = $('nav');
function render(p){
  cur = p; mode = 'qty';
  if(p.editor) return renderPrices();
  panel.innerHTML = `<div class="panel-head"><div><h1>${p.name}</h1><p>${p.sub}</p></div>
    <div class="mode-toggle" id="mode"><button type="button" class="active" data-mode="qty">По тиражам</button><button type="button" data-mode="urg">По срочности</button></div></div>
    <hr class="divider"><div class="work"><div>${p.form()}</div><div class="res-col"><div class="result" id="res"></div></div></div>`;
  if(p.init) p.init();
  update();
}
PRODUCTS.forEach((p,i)=>{
  const b = document.createElement('button');
  b.className = 'nav-item' + (i?'':' active');
  b.innerHTML = `<span class="dot"></span>${p.icon} ${p.name}`;
  b.onclick = ()=>{ nav.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(p); };
  nav.appendChild(b);
});

/* Общие обработчики (делегирование) */
panel.addEventListener('click', e=>{
  const t = e.target;
  const b = t.closest('.chip,.type-card');
  if(b){ [...b.parentElement.children].forEach(x=>x.classList.remove('active')); b.classList.add('active');
         if(b.parentElement.id==='ctype' && cur.dyn) cur.dyn(); }
  const qb = t.closest('[data-qv]');
  if(qb){ $('qty').value = qb.dataset.qv; qb.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===qb)); }
  const mb = t.closest('[data-mode]');
  if(mb){ mode = mb.dataset.mode; $('mode').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===mb)); }
  update();
});
panel.addEventListener('input', e=>{
  if(e.target.id==='qty') document.querySelectorAll('[data-qv]').forEach(x=>x.classList.remove('active'));
  update();
});
panel.addEventListener('change', update);

/* ===================== РЕДАКТОР ЦЕН ===================== */
function deepAssign(t,s){
  for(const k in s){
    if(s[k] && typeof s[k]==='object' && !Array.isArray(s[k]) && t[k] && typeof t[k]==='object') deepAssign(t[k],s[k]);
    else t[k] = s[k];
  }
}
const savePrices = () => localStorage.setItem('printcalc_prices', JSON.stringify(PRICES));
try{ const s = localStorage.getItem('printcalc_prices'); if(s) deepAssign(PRICES, JSON.parse(s)); }catch(e){}

function renderPrices(){
  const skip = ['colorLists','paperLists','offsetTable'];
  const LABELS = {sheetArea:'Площадь листа A4, м²', workDiscountShare:'Доля тиражной скидки, действующая на работы (0 — нет скидки, 1 — как у печати)'};
  let html = '', general = [];
  const walk = (obj,path,ttl)=>{
    const leaves = [];
    for(const k in obj){
      const v = obj[k], p = path.concat(k);
      if(typeof v==='number') leaves.push([k,p,v]);
      else if(Array.isArray(v)){
        if(v.length && v[0] && typeof v[0]==='object' && !Array.isArray(v[0]))
          v.forEach((it,i)=>{ if(typeof it.price==='number') leaves.push([it.name,p.concat(i,'price'),it.price]);
                              if(typeof it.mult==='number') leaves.push([it.name+' (×)',p.concat(i,'mult'),it.mult]); });
        else v.forEach((t,i)=>{ if(Array.isArray(t)) leaves.push(['от '+t[0]+' шт. (множитель)',p.concat(i,1),t[1]]); });
      } else if(v && typeof v==='object') walk(v,p,ttl+' / '+k);
    }
    if(leaves.length) html += `<div class="block-title">${ttl}</div><div class="grid2">${leaves.map(([n,p,v])=>
      `<div class="field"><label>${n}</label><input type="number" step="any" value="${v}" data-path='${JSON.stringify(p)}'></div>`).join('')}</div>`;
  };
  for(const k in PRICES){
    if(skip.includes(k)) continue;
    if(typeof PRICES[k]==='number') general.push([LABELS[k]||k,[k],PRICES[k]]);
    else walk(PRICES[k],[k],k);
  }
  html = `<div class="block-title">Общее</div><div class="grid2">${general.map(([n,p,v])=>
    `<div class="field"><label>${n}</label><input type="number" step="any" value="${v}" data-path='${JSON.stringify(p)}'></div>`).join('')}</div>` + html;

  panel.innerHTML = `<div class="panel-head"><div><h1>Цены</h1><p>Изменения сохраняются автоматически</p></div></div><hr class="divider">${html}
    <div class="block-title">JSON цен</div>
    <textarea id="pr_json" style="width:100%;height:240px;font-family:monospace;font-size:12px;border:1.5px solid var(--line);border-radius:10px;padding:12px"></textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="chip active" id="pr_apply">Применить JSON</button>
      <button class="chip" id="pr_copy">Копировать</button>
      <button class="chip" id="pr_reset">Сбросить к умолчанию</button>
    </div>`;
  const ta = $('pr_json'), show = ()=> ta.value = JSON.stringify(PRICES,null,2);
  panel.querySelectorAll('input[data-path]').forEach(inp=>inp.addEventListener('input',()=>{
    const path = JSON.parse(inp.dataset.path), v = parseFloat(inp.value);
    if(isNaN(v)) return;
    let o = PRICES; for(let i=0;i<path.length-1;i++) o = o[path[i]];
    o[path[path.length-1]] = v; savePrices(); show();
  }));
  $('pr_apply').onclick = ()=>{ try{ deepAssign(PRICES, JSON.parse(ta.value)); savePrices(); renderPrices(); }catch(e){ alert('Ошибка JSON: '+e.message); } };
  $('pr_copy').onclick = ()=>{ show(); navigator.clipboard?.writeText(ta.value); };
  $('pr_reset').onclick = ()=>{ if(confirm('Сбросить все цены?')){ localStorage.removeItem('printcalc_prices'); location.reload(); } };
  show();
}

/* ===================== СТАРТ ===================== */
render(PRODUCTS[0]);
</script>
</body>
</html>
