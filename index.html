<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прайс-калькулятор | Типография</title>
<style>
:root{
  --ink:#10231c;--accent:#0f9d78;--accent-dark:#0b7a5d;--accent-soft:#e3f7ef;
  --paper:#fbfaf6;--card:#ffffff;--line:#e4e1d6;--muted:#8b8a7f;
  --radius:14px;--shadow:0 10px 30px rgba(16,35,28,.08);
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  background:radial-gradient(circle at 10% 0%,#eef8f2 0,transparent 45%),radial-gradient(circle at 90% 100%,#f5efe2 0,transparent 50%),var(--paper);
  color:var(--ink);min-height:100vh;
}
.shell{max-width:1120px;margin:28px auto;display:grid;grid-template-columns:230px 1fr;gap:22px;padding:0 16px;}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 18px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;}
.brand .name{font-weight:700;font-size:16px;line-height:1.1;}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.04em;}
.sidenav{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 12px;height:fit-content;position:sticky;top:24px;}
.nav-scroll{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow-y:auto;padding-right:4px;}
.nav-scroll::-webkit-scrollbar{width:5px;}
.nav-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.nav-item{border:none;background:none;text-align:left;padding:11px 14px;border-radius:10px;font-size:14.5px;color:#4c4b43;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:10px;transition:background .15s,color .15s;}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 auto;}
.nav-item:hover{background:var(--accent-soft);}
.nav-item.active{background:var(--ink);color:#fff;font-weight:700;}
.nav-item.active .dot{background:var(--accent);}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px 38px;min-width:0;}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
.panel-head h1{font-size:24px;margin:0;letter-spacing:-.01em;}
.panel-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;}
.mode-toggle{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;}
.mode-toggle button{border:none;background:none;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
.mode-toggle button.active{background:var(--ink);color:#fff;}
.divider{border:none;height:1px;background:var(--line);margin:0 0 26px;}
.block-title{text-transform:uppercase;font-size:11.5px;letter-spacing:.09em;color:var(--accent-dark);font-weight:700;margin:30px 0 16px;display:flex;align-items:center;gap:8px;}
.block-title::after{content:'';flex:1;height:1px;background:var(--line);}
.field{margin-bottom:20px;}
.field>label{display:block;font-size:14px;font-weight:700;margin-bottom:9px;color:var(--ink);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;}
  .sidenav{position:static;}
  .nav-scroll{max-height:none;flex-direction:row;flex-wrap:wrap;}
  .grid2{grid-template-columns:1fr;}
  .type-cards{grid-template-columns:repeat(2,1fr)!important;}
}
select,input[type=number],input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14.5px;color:var(--ink);background:var(--paper);outline:none;font-family:inherit;}
select:focus,input:focus{border-color:var(--accent);background:#fff;}
.chips{display:flex;gap:10px;flex-wrap:wrap;}
.chip{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px;color:#4c4b43;font-weight:600;}
.chip.active{border-color:var(--accent);background:var(--ink);color:#fff;}
.qty-box input{margin-bottom:10px;}
.qty-chips{display:flex;gap:8px;flex-wrap:wrap;}
.qty-chips button{padding:9px 15px;border-radius:8px;border:1.5px dashed var(--line);background:#fff;cursor:pointer;font-size:13.5px;color:#4c4b43;font-weight:600;}
.qty-chips button.active{border-style:solid;border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}
.switch-row{display:flex;align-items:center;gap:12px;margin:20px 0;cursor:pointer;user-select:none;}
.switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:0 0 auto;}
.switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch-row input{display:none;}
.switch-row input:checked+.switch{background:var(--accent);}
.switch-row input:checked+.switch::after{left:21px;}
.switch-row .stxt{font-size:14.5px;font-weight:600;}
.sub-options{display:none;margin:0 0 18px 54px;padding:14px 16px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;}
.sub-options.show{display:block;}
.sub-options label{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;margin-bottom:9px;cursor:pointer;flex-wrap:wrap;}
.sub-options label:last-child{margin-bottom:0;}
.sub-options select{width:auto;padding:8px 10px;}
.note{background:var(--accent-soft);border-radius:10px;padding:14px 16px;font-size:13.5px;color:#2d5c48;margin:10px 0 22px;}
.note b{color:var(--ink);}
.custom-dim{display:none;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;}
.custom-dim.show{display:grid;}
.type-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.type-card{border:1.5px solid var(--line);border-radius:12px;padding:16px 8px 12px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#4c4b43;background:#fff;}
.type-card .ico{width:36px;height:36px;margin:0 auto 10px;border-radius:9px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:19px;}
.type-card.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
.type-card.active .ico{background:var(--accent);color:#fff;}
.submit-btn{margin-top:14px;background:var(--accent);color:#fff;border:none;padding:15px 34px;border-radius:999px;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(15,157,120,.3);}
.submit-btn:hover{background:var(--accent-dark);}
.result{margin-top:30px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);display:none;}
.result.show{display:block;}
.result-header{background:var(--ink);color:#fff;padding:16px 22px;font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.result-header span.tag{background:var(--accent);font-size:11.5px;padding:4px 10px;border-radius:999px;font-weight:700;}
.result-body{padding:18px 22px 6px;background:#fff;}
.rline{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:14px;border-bottom:1px solid #f0efe8;}
.rline:last-child{border-bottom:none;}
.rline .v{font-weight:700;white-space:nowrap;}
.rline.warn{color:#b3541e;font-weight:600;}
.result-total{background:var(--accent-soft);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800;color:var(--accent-dark);}
table.urg{width:100%;border-collapse:collapse;}
table.urg th,table.urg td{text-align:left;padding:12px 10px;font-size:13.5px;border-bottom:1px solid #f0efe8;}
table.urg th{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.05em;}
table.urg tr.pick td{font-weight:700;color:var(--accent-dark);background:var(--accent-soft);}
table.offt{border-collapse:collapse;font-size:12px;}
table.offt th,table.offt td{border:1px solid var(--line);padding:3px;text-align:center;}
table.offt th{background:var(--paper);font-size:11px;}
table.offt input{width:76px;padding:4px 6px;font-size:12px;border-radius:6px;}
</style>
</head>

/* ===================== ЯРЛЫКИ ДЛЯ РЕДАКТОРА ===================== */
const TITLES={paper:'Материалы — цена за лист A3, ₽',digital:'Цифровая печать A3 (₽ за лист)',offset:'Офсет: пластины и приладка',layout:'Раскладка на листе',services:'Услуги и постпечать',urgency:'Срочность (множитель)'};
const LABELS={
  maxSheets:'Цифра работает до N листов A3',extra:'Доплата за материал, ₽/лист',g170_200:'Мелованная/плотная 170–200 г',g250_300:'250–300 г (в т.ч. картон)',selfAdhesive:'Самоклейка',

};

/* ===================== БАЗОВЫЕ ФУНКЦИИ ===================== */
const fmt  = n => n.toLocaleString('ru-RU',{maximumFractionDigits:0}) + ' ₽';
const fmt2 = n => n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ₽';
const $ = id => document.getElementById(id);
const S = () => PRICES.services;

const SIZES = {
  "A6 (105x148)":[105,148],"A5 (148x210)":[148,210],"A4 (210x297)":[210,297],"A3 (297x420)":[297,420],"A2 (420x594)":[420,594],
  "90x50 мм":[90,50],"85x55 мм":[85,55],"Евробуклет (99x210)":[99,210]
};
const PRINT_TYPES = {
  "4+0 — цветная, 1 сторона":"4+0",
  "4+4 с/с — цветная, 2 стороны":"4+4_cs",
  "4+4 р/к — цветная, 2 стороны":"4+4_rk"
};
const PT = Object.keys(PRINT_TYPES), PT0 = ['Без печати'].concat(PT);
const ck = name => PRINT_TYPES[name];
const allPapers = () => Object.keys(PRICES.paper);

/* Сколько изделий w×h помещается на лист A3 (297×420) */
function ups(w,h,gap){
  gap = gap===undefined ? PRICES.layout.gap : gap;
  w=(w||0)+gap; h=(h||0)+gap;
  if(w<=gap||h<=gap) return 0;
  return Math.max(Math.floor(297/w)*Math.floor(420/h), Math.floor(297/h)*Math.floor(420/w));
}
function paperExtra(name){
  const E=PRICES.digital.extra;
  if(/Самоклеящаяся/.test(name)) return E.selfAdhesive;
  const g=parseInt((name.match(/(\d+)\s*г/)||[])[1])||0;
  if(g>=250) return E.g250_300;
  if(g>=170) return E.g170_200;
  return 0;
}
function offsetWork(net,colorKey,ra,size){
  const T=PRICES.offsetTable;
  const keys=Object.keys(T.rows).map(Number).sort((a,b)=>a-b);
  const key=keys.find(k=>k>=net);
  if(key===undefined) return null;
  const col = size==='A2' ? 'A2_'+colorKey : (ra?'A3_RA_':'A3_')+colorKey;
  const i=T.columns.indexOf(col);
  if(i<0) return null;
  return {v:T.rows[key][i],key};
}
/* Печатная форма: net — чистое число листов A3 (без приладки).
   Возвращает массив строк {label,t} (t — итог по заказу, null = нет данных) */
function printJob(label,net,colorKey,paperName,ra,size){
  net=Math.max(1,Math.ceil(net)); size=size||'A3';
  const D=PRICES.digital,O=PRICES.offset,pp=PRICES.paper[paperName];
  if(size==='A3' && net<=D.maxSheets){
    const t=D.tiers.find(x=>net>=x.from&&net<=x.to);
    const base=t?(colorKey==='4+0'?t.c40:t.c44):null, ex=paperExtra(paperName);
    return [{label:`${label}: цифровая печать, ${net} л. A3 × ${base==null?'—':base}${ex?' + '+ex+' (материал)':''} ₽`,t:(base==null||ex==null)?null:(base+ex)*net}];
  }
  const k=size==='A2'?2:1;
  const waste=size==='A2'?O.wasteA2[colorKey]:O.waste[colorKey];
  const plate=size==='A2'?O.plateA2:O.plateA3;
  const pl=O.plates[colorKey];
  const w=offsetWork(net,colorKey,ra,size);
  const rows=[
    {label:`${label}: бумага ${net}+${waste==null?'—':waste} (приладка) л. ${size} × ${pp==null?'—':pp*k} ₽`,t:(pp==null||waste==null)?null:(net+waste)*pp*k},
    {label:`${label}: пластины ${pl} × ${plate==null?'—':plate} ₽`,t:plate==null?null:pl*plate},
    {label:`${label}: работа по прайсу (${size}${ra&&size==='A3'?', для Р/А':''}, ${colorKey}, ступень ${w?w.key:'—'} л.)`,t:w?w.v:null}
  ];
  if(net<500) rows.push({label:'⚠ Мало листов для офсета: действует минимальная ступень 500 л. Уточните цифровую печать для такого тиража.',info:true});
  return rows;
}
function multRows(rows,m,suffix){
  return rows.map(r=>r.info?r:{label:r.label+suffix,t:r.t==null?null:r.t*m});
}
function paperOnly(label,net,paperName,size){
  const pp=PRICES.paper[paperName], k=size==='A2'?2:1;
  return {label:`${label}: бумага ${net} л. × ${pp==null?'—':pp*k} ₽`,t:pp==null?null:Math.ceil(net)*pp*k};
}
/* Если «Без печати» — только бумага */
function jobOrPaper(label,net,colorName,paperName,ra,size){
  const key=ck(colorName);
  return key ? printJob(label,net,key,paperName,ra,size) : [paperOnly(label,Math.ceil(net),paperName,size)];
}
function springPrice(fmtName){
  if(/^A6/.test(fmtName)) return S().springA6;
  if(/^A5/.test(fmtName)) return S().springA5;
  if(/^A4/.test(fmtName)) return S().springA4;
  return null;
}

/* build(qty, ra) → массив строк {label, t} — стоимость ЗА ВЕСЬ ТИРАЖ (t=null → нет данных) */
function bindCalc(p,st,build,unitName){
  $(p+'_calc').addEventListener('click',()=>{
    const qty=getQty(p); if(!qty) return;
    const ra=$(p+'_ra').checked;
    const rows=build(qty,ra).flat(Infinity).filter(Boolean);
    const bad=r=>!r.info&&(r.t==null||isNaN(r.t));
    const view=rows.map(r=>({label:r.label,value:r.info?'':(bad(r)?'—':fmt(r.t))}));
    if(rows.some(bad)){
      view.push({label:'⚠ Не хватает данных в прайсе (строки «—»). Заполните их во вкладке «Цены».',value:''});
      output(p,st.mode,view,0,true);return;
    }
    const total=rows.reduce((s,r)=>s+(r.t||0),0);
    view.push({label:'Тираж',value:qty+' шт.'},{label:unitName||'Цена за штуку',value:fmt2(total/qty)});
    output(p,st.mode,view,total,false);
  });
}

/* ===================== БРОШЮРЫ И КНИГИ (общий расчёт) ===================== */
/* Внутренний блок: формы по A3. На листе A3 помещается 2×ups страниц (с двух сторон).
   Каждая форма печатается тиражом qty листов. Обложка — разворот (2 ширины). */
function bookJob(o){
  const g=PRICES.layout.gap,rows=[];
  const pu=ups(o.w,o.h,g), cu=ups(o.w*2,o.h,g);
  if(!pu||!cu) return [{label:'Формат не помещается на лист A3',t:null}];
  const pps=2*pu, pages=Math.max(4,Math.ceil(o.pages/4)*4), forms=Math.ceil(pages/pps);
  rows.push(...multRows(printJob(`Блок (${pages} стр.)`,o.qty,ck(o.inCol),o.inPaper,o.ra),forms,` — ${forms} форм(ы) по ${pps} стр.`));
  rows.push(...printJob('Обложка',Math.ceil(o.qty/cu),ck(o.covCol),o.covPaper,o.ra));
  const f=S().fold, q=o.qty;
  if(o.bind==='staple'){
    rows.push({label:`Сборка: фальцовка ${forms+1} × ${f} + пикало ${S().pikalo} ₽`,t:((forms+1)*f+S().pikalo)*q});
  } else if(o.bind==='glue'){
    const tb=/^A5/.test(o.fmtName)?S().thermoBind_A5:null;
    rows.push({label:`Фальцовка тетрадей ${forms} × ${f} ₽`,t:forms*f*q});
    rows.push({label:'Термопереплёт (цена задана для A5)',t:tb==null?null:tb*q});
  } else {
    const sp=springPrice(o.fmtName);
    rows.push({label:'Пружина',t:sp==null?null:sp*q});
  }
  return rows.concat(o.extra||[]);
}
const bindCode=n=>/скреп/.test(n)?'staple':(/клей|КБС/.test(n)?'glue':'spring');

        ${selectField(p+'_color','Печать',PT,PT[0])}

/* ===================== РЕДАКТОР ЦЕН ===================== */
function deepAssign(t,s){
  for(const k in s){
    if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object') deepAssign(t[k],s[k]);
    else t[k]=s[k];
  }
}
const LS_KEY='printcalc_prices_v3';
const savePrices=()=>localStorage.setItem(LS_KEY,JSON.stringify(PRICES));
(function(){try{const s=localStorage.getItem(LS_KEY);if(s)deepAssign(PRICES,JSON.parse(s));}catch(e){}})();

function renderPrices(){
  const skip=['paperLists','offsetTable'];
  let html='';
  const inp=(pp,v)=>`<input type="number" step="any" value="${v==null?'':v}" placeholder="—" data-path='${JSON.stringify(pp)}'>`;
  function walk(obj,path,title){
    const leaves=[];
    for(const k in obj){
      const v=obj[k],pth=path.concat(k);
      if(typeof v==='number'||v===null) leaves.push([LABELS[k]||k,pth,v]);
      else if(Array.isArray(v)){
        v.forEach((it,i)=>{
          if(it&&typeof it==='object') for(const key in it){
            if(typeof it[key]!=='number'||key==='from'||key==='to') continue;
            const base=it.name||(it.from===it.to?it.from+' шт.':'от '+it.from+' до '+it.to+' шт.');
            const suffix={mult:' (×)',c40:' — 4+0',c44:' — 4+4'}[key]??(' ('+key+')');
            leaves.push([base+suffix,pth.concat(i,key),it[key]]);
          }
        });
      } else if(v&&typeof v==='object') walk(v,pth,title+' / '+(LABELS[k]||k));
    }
    if(leaves.length) html+=`<div class="block-title">${title}</div><div class="grid2">`+
      leaves.map(([n,pp,v])=>`<div class="field"><label>${n}</label>${inp(pp,v)}</div>`).join('')+`</div>`;
  }
  for(const k in PRICES){ if(skip.includes(k)) continue; walk(PRICES[k],[k],TITLES[k]||k); }
  const T=PRICES.offsetTable;
  const table=`<div class="block-title">Офсетный прайс — работа по листам A3/A2, ₽</div>
    <div style="overflow-x:auto"><table class="offt"><thead><tr><th>Листов</th>${T.columns.map(c=>`<th>${c.replace('A3_RA_','A3 Р/А ').replace('A3_','A3 ').replace('A2_','A2 ').replace('_cs',' с/с').replace('_rk',' р/к')}</th>`).join('')}</tr></thead><tbody>
    ${Object.keys(T.rows).map(r=>`<tr><th>${r}</th>${T.rows[r].map((v,i)=>`<td>${inp(['offsetTable','rows',r,i],v)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  panel.innerHTML=`
    <div class="panel-head"><div><h1>Цены</h1><p>Изменения сохраняются в браузере автоматически. Пустое поле = «нет данных» (в расчёте будет «—»)</p></div></div>
    <hr class="divider">
    ${html}${table}
    <div class="block-title">JSON цен</div>
    <textarea id="pr_json" style="width:100%;height:260px;font-family:monospace;font-size:12px;border:1.5px solid var(--line);border-radius:10px;padding:12px"></textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="submit-btn" id="pr_show" style="background:var(--ink)">Обновить JSON</button>
      <button class="submit-btn" id="pr_apply">Применить JSON</button>
      <button class="submit-btn" id="pr_copy" style="background:var(--ink)">Копировать</button>
      <button class="submit-btn" id="pr_reset" style="background:#c0392b">Сбросить цены</button>
    </div>`;
  const ta=$('pr_json');
  const show=()=>{ta.value=JSON.stringify(PRICES,null,2);};
  panel.querySelectorAll('input[data-path]').forEach(i=>i.addEventListener('input',()=>{
    const path=JSON.parse(i.dataset.path);let o=PRICES;
    for(let j=0;j<path.length-1;j++) o=o[path[j]];
    if(i.value===''){o[path[path.length-1]]=null;}
    else{const val=parseFloat(i.value);if(isNaN(val))return;o[path[path.length-1]]=val;}
    savePrices();show();
  }));
  $('pr_show').onclick=show;
  $('pr_apply').onclick=()=>{try{deepAssign(PRICES,JSON.parse(ta.value));savePrices();renderPrices();}catch(e){alert('Ошибка JSON: '+e.message);}};
  $('pr_copy').onclick=()=>{show();navigator.clipboard.writeText(ta.value);};
  $('pr_reset').onclick=()=>{if(confirm('Сбросить все цены к значениям по умолчанию?')){localStorage.removeItem(LS_KEY);location.reload();}};
  show();
}
