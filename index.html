<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прайс-калькулятор | Типография</title>
<style>
:root{
  --ink:#10231c;--accent:#0f9d78;--accent-dark:#0b7a5d;--accent-soft:#e3f7ef;
  --paper:#fbfaf6;--card:#ffffff;--line:#e4e1d6;--muted:#8b8a7f;
  --radius:14px;--shadow:0 10px 30px rgba(16,35,28,.08);
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  background:radial-gradient(circle at 10% 0%,#eef8f2 0,transparent 45%),radial-gradient(circle at 90% 100%,#f5efe2 0,transparent 50%),var(--paper);
  color:var(--ink);min-height:100vh;
}
.shell{max-width:1120px;margin:28px auto;display:grid;grid-template-columns:230px 1fr;gap:22px;padding:0 16px;}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 18px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;}
.brand .name{font-weight:700;font-size:16px;line-height:1.1;}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.04em;}
.sidenav{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 12px;height:fit-content;position:sticky;top:24px;}
.nav-scroll{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow-y:auto;padding-right:4px;}
.nav-scroll::-webkit-scrollbar{width:5px;}
.nav-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.nav-item{border:none;background:none;text-align:left;padding:11px 14px;border-radius:10px;font-size:14.5px;color:#4c4b43;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:10px;transition:background .15s,color .15s;}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 auto;}
.nav-item:hover{background:var(--accent-soft);}
.nav-item.active{background:var(--ink);color:#fff;font-weight:700;}
.nav-item.active .dot{background:var(--accent);}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px 38px;}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
.panel-head h1{font-size:24px;margin:0;letter-spacing:-.01em;}
.panel-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;}
.mode-toggle{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;}
.mode-toggle button{border:none;background:none;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
.mode-toggle button.active{background:var(--ink);color:#fff;}
.divider{border:none;height:1px;background:var(--line);margin:0 0 26px;}
.block-title{text-transform:uppercase;font-size:11.5px;letter-spacing:.09em;color:var(--accent-dark);font-weight:700;margin:30px 0 16px;display:flex;align-items:center;gap:8px;}
.block-title::after{content:'';flex:1;height:1px;background:var(--line);}
.field{margin-bottom:20px;}
.field>label{display:block;font-size:14px;font-weight:700;margin-bottom:9px;color:var(--ink);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;}
  .sidenav{position:static;}
  .nav-scroll{max-height:none;flex-direction:row;flex-wrap:wrap;}
  .grid2{grid-template-columns:1fr;}
  .type-cards{grid-template-columns:repeat(2,1fr)!important;}
}
select,input[type=number],input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:14.5px;color:var(--ink);background:var(--paper);outline:none;font-family:inherit;}
select:focus,input:focus{border-color:var(--accent);background:#fff;}
.chips{display:flex;gap:10px;flex-wrap:wrap;}
.chip{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px;color:#4c4b43;font-weight:600;}
.chip.active{border-color:var(--accent);background:var(--ink);color:#fff;}
.qty-box input{margin-bottom:10px;}
.qty-chips{display:flex;gap:8px;flex-wrap:wrap;}
.qty-chips button{padding:9px 15px;border-radius:8px;border:1.5px dashed var(--line);background:#fff;cursor:pointer;font-size:13.5px;color:#4c4b43;font-weight:600;}
.qty-chips button.active{border-style:solid;border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}
.switch-row{display:flex;align-items:center;gap:12px;margin:20px 0;cursor:pointer;user-select:none;}
.switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:0 0 auto;}
.switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch-row input{display:none;}
.switch-row input:checked+.switch{background:var(--accent);}
.switch-row input:checked+.switch::after{left:21px;}
.switch-row .stxt{font-size:14.5px;font-weight:600;}
.sub-options{display:none;margin:0 0 18px 54px;padding:14px 16px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;}
.sub-options.show{display:block;}
.sub-options label{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;margin-bottom:9px;cursor:pointer;}
.sub-options label:last-child{margin-bottom:0;}
.note{background:var(--accent-soft);border-radius:10px;padding:14px 16px;font-size:13.5px;color:#2d5c48;margin:10px 0 22px;}
.note b{color:var(--ink);}
.custom-dim{display:none;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;}
.custom-dim.show{display:grid;}
.type-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.type-card{border:1.5px solid var(--line);border-radius:12px;padding:16px 8px 12px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#4c4b43;background:#fff;}
.type-card .ico{width:36px;height:36px;margin:0 auto 10px;border-radius:9px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:19px;}
.type-card.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
.type-card.active .ico{background:var(--accent);color:#fff;}
.submit-btn{margin-top:14px;background:var(--accent);color:#fff;border:none;padding:15px 34px;border-radius:999px;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(15,157,120,.3);}
.submit-btn:hover{background:var(--accent-dark);}
.result{margin-top:30px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);display:none;}
.result.show{display:block;}
.result-header{background:var(--ink);color:#fff;padding:16px 22px;font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.result-header span.tag{background:var(--accent);font-size:11.5px;padding:4px 10px;border-radius:999px;font-weight:700;}
.result-body{padding:18px 22px 6px;background:#fff;}
.rline{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:14px;border-bottom:1px solid #f0efe8;}
.rline:last-child{border-bottom:none;}
.rline .v{font-weight:700;white-space:nowrap;}
.result-total{background:var(--accent-soft);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800;color:var(--accent-dark);}
table.urg{width:100%;border-collapse:collapse;}
table.urg th,table.urg td{text-align:left;padding:12px 10px;font-size:13.5px;border-bottom:1px solid #f0efe8;}
table.urg th{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.05em;}
table.urg tr.pick td{font-weight:700;color:var(--accent-dark);background:var(--accent-soft);}

  "A5 (148x210)":[148,210],"A4 (210x297)":[210,297],"A6 (105x148)":[105,148],"A3 (297x420)":[297,420],

};
function areaFromFormat(f, cw, ch){
  const [w,h] = SIZES[f] || [cw||210, ch||297];
  return (w*h)/1e6;
}

function chipGroup(id,label,options,def){
  return `<div class="field"><label>${label}</label><div class="chips" id="${id}">
    ${options.map(o=>`<button type="button" class="chip ${o===def?'active':''}" data-val="${o}">${o}</button>`).join('')}
  </div></div>`;
}
function numField(id,label,val,extra=''){
  return `<div class="field"><label>${label}</label><input type="number" id="${id}" value="${val}" ${extra}></div>`;
}
function qtyField(id){
  return `<div class="field qty-box"><label>Тираж, шт.</label>
    <input type="number" id="${id}" min="1" placeholder="0" value="">
    <div class="qty-chips" id="${id}_presets">${[100,200,300,500,1000].map(v=>`<button type="button" data-val="${v}">${v}</button>`).join('')}</div>
  </div>`;
}
function postTreatmentBlock(id,items){
  return `<label class="switch-row"><input type="checkbox" id="${id}_chk"><span class="switch"></span><span class="stxt">Послепечатная обработка</span></label>
  <div class="sub-options" id="${id}_box">
    ${items.map(it=>`<label><input type="checkbox" class="pt_${id}" value="${it.price}" data-name="${it.name}">${it.name} <span style="color:#8b8a7f">(+${it.price} ₽/изд.)</span></label>`).join('')}
  </div>`;
}
function laminationBlock(id,items){
  return `<label class="switch-row"><input type="checkbox" id="${id}_lam_chk"><span class="switch"></span><span class="stxt">Ламинация</span></label>
  <div class="sub-options" id="${id}_lam_box">
    ${items.map((it,i)=>`<label><input type="radio" name="${id}_lam" value="${it.price}" data-name="${it.name}" ${i===0?'checked':''}>${it.name} <span style="color:#8b8a7f">(+${it.price} ₽/изд.)</span></label>`).join('')}
  </div>`;
}
function wireToggle(chkId, boxId){
  const chk=$(chkId), box=$(boxId);
  chk.addEventListener('change',()=>box.classList.toggle('show',chk.checked));
}
const wireLamination = id => wireToggle(id+'_lam_chk', id+'_lam_box');
const wirePostTreatment = id => wireToggle(id+'_chk', id+'_box');
function getLamination(id){
  const chk=$(id+'_lam_chk');
  if(!chk||!chk.checked) return {sum:0,name:''};
  const r=document.querySelector(`input[name="${id}_lam"]:checked`);
  return {sum:parseFloat(r.value),name:r.dataset.name};
}
function getPostTreatmentTotal(id){
  let sum=0,names=[];
  document.querySelectorAll(`.pt_${id}:checked`).forEach(c=>{sum+=parseFloat(c.value);names.push(c.dataset.name);});
  return {sum,names};
}
function modeToggle(p){
  return `<div class="mode-toggle">
    <button type="button" class="active" id="${p}_seg_qty">По тиражам</button>
    <button type="button" id="${p}_seg_urg">По срочности</button></div>`;
}
function wireChips(id){
  document.querySelectorAll(`#${id} .chip`).forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll(`#${id} .chip`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }));
}
function wireCards(id, onPick){
  document.querySelectorAll(`#${id} .type-card`).forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll(`#${id} .type-card`).forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    if(onPick) onPick(c.dataset.val);
  }));
}
const getChipVal = id => { const el=document.querySelector(`#${id} .chip.active`); return el?el.dataset.val:null; };
const getCardVal = id => document.querySelector(`#${id} .type-card.active`).dataset.val;
function wireQty(id){
  const input=$(id), btns=document.querySelectorAll(`#${id}_presets button`);
  btns.forEach(btn=>btn.addEventListener('click',()=>{
    btns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    input.value=btn.dataset.val;
  }));
  input.addEventListener('input',()=>btns.forEach(b=>b.classList.remove('active')));
}
function typeCards(id,items,cols){
  return `<div class="type-cards" id="${id}" ${cols?`style="grid-template-columns:repeat(${cols},1fr)"`:''}>
    ${items.map((t,i)=>`<div class="type-card ${i===0?'active':''}" data-val="${t[1]}"><span class="ico">${t[0]}</span>${t[1]}</div>`).join('')}</div>`;
}
/* Площадь по чипам формата (с учётом «Свой размер») */
function areaByChip(p,chipId){
  const v=getChipVal(chipId);
  return v==='Свой размер (мм)'
    ? areaFromFormat(null,parseFloat($(p+'_w').value),parseFloat($(p+'_h').value))
    : areaFromFormat(v);
}
function wireCustomDim(p){
  document.querySelectorAll(`#${p}_fmt .chip`).forEach(b=>b.addEventListener('click',()=>{
    $(p+'_custom').classList.toggle('show',b.dataset.val==='Свой размер (мм)');
  }));
}
const customDim = (p,w,h) => `<div class="custom-dim" id="${p}_custom">${numField(p+'_w','Ширина, мм',w)}${numField(p+'_h','Высота, мм',h)}</div>`;

function panelShell(p,title,subtitle,inner){
  return `<div class="panel-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${modeToggle(p)}</div>
  <hr class="divider">${inner}
  <button class="submit-btn" id="${p}_calc">Рассчитать стоимость</button>
  <div class="result" id="${p}_result">
    <div class="result-header"><span>Результат расчёта</span><span class="tag">по тиражу</span></div>
    <div class="result-body" id="${p}_rows"></div>
    <div class="result-total"><span>Итого к оплате</span><span id="${p}_total">0 ₽</span></div>
  </div>
  <div class="result" id="${p}_result_urg">
    <div class="result-header"><span>Сроки изготовления</span><span class="tag">по срочности</span></div>
    <div class="result-body" style="padding-bottom:18px;">
      <table class="urg"><thead><tr><th>Срочность</th><th>Срок</th><th>Наценка</th><th>Стоимость</th></tr></thead>
      <tbody id="${p}_urg_body"></tbody></table>
    </div>
  </div>`;
}
function hideResults(p){ $(p+'_result').classList.remove('show'); $(p+'_result_urg').classList.remove('show'); }
function output(p,mode,rows,total){
  hideResults(p);
  if(mode==='qty'){
    $(p+'_rows').innerHTML=rows.map(r=>`<div class="rline"><span>${r.label}</span><span class="v">${r.value}</span></div>`).join('');
    $(p+'_total').textContent=fmt(total);
    $(p+'_result').classList.add('show');
  } else {
    $(p+'_urg_body').innerHTML=PRICES.urgency.map((l,i)=>`<tr class="${i===0?'pick':''}">
      <td>${l.name}</td><td>${l.days}</td><td>${l.mult===1?'—':'+'+Math.round((l.mult-1)*100)+'%'}</td><td>${fmt(total*l.mult)}</td></tr>`).join('');
    $(p+'_result_urg').classList.add('show');
  }
}
function setupMode(p){
  const state={mode:'qty'}, q=$(p+'_seg_qty'), u=$(p+'_seg_urg');
  q.addEventListener('click',()=>{q.classList.add('active');u.classList.remove('active');state.mode='qty';hideResults(p);});
  u.addEventListener('click',()=>{u.classList.add('active');q.classList.remove('active');state.mode='urgency';hideResults(p);});
  return state;
}
function getQty(p){
  const qty=parseInt($(p+'_qty').value)||0;
  if(qty<=0){alert('Укажите тираж');return 0;}
  return qty;
}
/* Общая логика: build(qty) возвращает строки {label, v} — стоимость ЗА ШТУКУ.
   Итог = сумма за штуку × тираж. Скидок нет. */
function bindCalc(p,st,build,unitName){
  $(p+'_calc').addEventListener('click',()=>{
    const qty=getQty(p); if(!qty) return;
    const rows=build(qty).filter(Boolean);
    const unit=rows.reduce((s,r)=>s+r.v,0);
    const total=unit*qty;
    output(p,st.mode,rows.map(r=>({label:r.label,value:fmt(r.v*qty)})).concat([
      {label:'Тираж',value:qty+' шт.'},
      {label:unitName||'Цена за штуку',value:fmt2(unit)}
    ]),total);
  });
}
const evenPages = n => { n=parseInt(n)||4; return n+(n%2); };

function posterExtra(paperName){
  const E=PRICES.digitalPosterA3.extra;
  if(paperName.startsWith('Самоклеящаяся')) return E['Самоклейка'];
  if(paperName.startsWith('Мелованная')){
    const g=parseInt((paperName.match(/(\d+)\s*г/)||[])[1])||0;
    if(g>=250) return E['Мелованная 250–300 г'];
    if(g>=170) return E['Мелованная 170–200 г'];
  }
  return 0;
}
function posterTier(qty){
  const T=PRICES.digitalPosterA3.paperUpTo150;
  return T.find(t=>qty>=t.from&&qty<=t.to)||(qty<T[0].from?T[0]:T[T.length-1]);
}
function renderPosters(){
  const p='pst',C=PRICES.posters;
  panel.innerHTML=panelShell(p,'Плакаты','A3 — по прайсу цифровой печати, остальные форматы — по площади',`
    <div class="grid2">
      ${selectField(p+'_fmt','Формат плаката',['A3 (297x420)','A2 (420x594)','A1 (594x841)','A0 (841x1189)','Свой размер (мм)'],'A3 (297x420)')}

    </div>
    ${customDim(p,500,700)}
    ${selectField(p+'_paper','Материал',PRICES.paperLists.posters,'Бумага 150 г/кв.м')}
    ${qtyField(p+'_qty')}
    ${postTreatmentBlock(p,C.post)}
  `);
  wireQty(p+'_qty');wirePostTreatment(p);
  $(p+'_fmt').addEventListener('change',e=>$(p+'_custom').classList.toggle('show',e.target.value==='Свой размер (мм)'));
  const st=setupMode(p);
  const sizes={'A3 (297x420)':[297,420],'A2 (420x594)':[420,594],'A1 (594x841)':[594,841],'A0 (841x1189)':[841,1189]};
  bindCalc(p,st,qty=>{
    const fmtVal=$(p+'_fmt').value, colorName=$(p+'_color').value, paperName=$(p+'_paper').value;
    const is44=colorName.includes('4+4');
    const pt=getPostTreatmentTotal(p);
    let rows=[];
    if(fmtVal==='A3 (297x420)'){
      const t=posterTier(qty);
      rows.push({label:`Печать A3 (${is44?'4+4':'4+0'}, ${t.from===t.to?t.from+' шт.':'от '+t.from+' до '+t.to}${qty>t.to?'+':''})`,v:is44?t.c44:t.c40});
      const ex=posterExtra(paperName);
      if(ex) rows.push({label:'Доплата за материал',v:ex});
    } else {
      let w,h;
      if(sizes[fmtVal]) [w,h]=sizes[fmtVal];
      else { w=parseFloat($(p+'_w').value)||500; h=parseFloat($(p+'_h').value)||700; }
      rows.push({label:'Печать',v:PAPER()[paperName]*COLOR()[colorName]*factor(w*h/1e6)});
    }
    if(pt.sum) rows.push({label:'Отделка ('+pt.names.join(', ')+')',v:pt.sum});
    return rows;
  },'Цена за плакат');
}

function renderCalendars(){

  panel.innerHTML=panelShell(p,'Календари','Настенные, настольные, карманные',`
    <div class="field"><label>Тип календаря</label>
    ${typeCards(p+'_type',[['📅','Перекидной'],['🗓️','Квартальный'],['📆','Настольный'],['🧮','Карманный'],['🔺','Пирамидка']],5)}

    ${qtyField(p+'_qty')}
  `);

      dyn.innerHTML=`
        ${selectField(p+'_fmt','Формат',Object.keys(sizes),'A4 (210x297)')}
        <div class="block-title">Блок</div>
        <div class="grid2">
          ${numField(p+'_sheets','Количество листов',12,'min="1"')}

        </div>

        <div class="block-title">Обложка</div>
        <div class="grid2">
          ${selectField(p+'_covcolor','Печать обложки (цветность)',CL,CL[0])}
          ${selectField(p+'_covpaper','Материал обложки',PRICES.paperLists.cardboard.concat(['Мелованная бумага 250 г/кв.м']),'Картон двусторонний 300 г/кв.м')}
        </div>
        ${desk?`<div class="block-title">Основание</div>
          ${selectField(p+'_basepaper','Материал основания',PRICES.paperLists.deskBase,'Картон двусторонний 300 г/кв.м')}
          ${laminationBlock(p,C.deskLam)}`:postTreatmentBlock(p,C.flipPost)}`;
      if(desk) wireLamination(p); else wirePostTreatment(p);
    } else if(type==='Квартальный'){
      dyn.innerHTML=`
        ${selectField(p+'_size','Формат',Object.keys(C.quarterSize),'Миди')}
        <div class="grid2">
          ${numField(p+'_fields','Количество печатных полей',3,'min="1" max="6"')}
          ${selectField(p+'_color','Печать (цветность)',CL,CL[0])}
        </div>
        ${selectField(p+'_paper','Бумага',['Мелованная бумага 200 г/кв.м','Мелованная бумага 250 г/кв.м','Картон односторонний 300 г/кв.м','Картон двусторонний 300 г/кв.м'],'Мелованная бумага 250 г/кв.м')}`;
    } else if(type==='Карманный'){
      dyn.innerHTML=`
        ${selectField(p+'_color','Печать (цветность)',CL,CL[1])}
        ${selectField(p+'_paper','Материал',PRICES.paperLists.cardboard,'Картон односторонний 300 г/кв.м')}
        <label class="switch-row"><input type="checkbox" id="${p}_round_chk"><span class="switch"></span><span class="stxt">Скругление углов</span></label>
        ${laminationBlock(p,C.pocketLam)}`;
      wireLamination(p);
    } else {
      dyn.innerHTML=`
        ${selectField(p+'_color','Печать (цветность)',[CL[0]],CL[0])}
        ${selectField(p+'_paper','Материал',PRICES.paperLists.cardboard,'Картон двусторонний 300 г/кв.м')}
        <div class="grid2">
          ${numField(p+'_faces','Количество граней (сменных вкладышей)',4,'min="3" max="6"')}
          ${selectField(p+'_mount','Крепление',Object.keys(C.pyramidMount),'Двусторонний скотч')}
        </div>`;
    }
  }
  renderDynamic('Перекидной');
  wireCards(p+'_type',t=>{renderDynamic(t);hideResults(p);});
  const st=setupMode(p);

  bindCalc(p,st,()=>{
    const type=getCardVal(p+'_type');
    if(type==='Перекидной'||type==='Настольный'){
      const desk=type==='Настольный';
      const [w,h]=sizes[g('_fmt').value];
      const sf=factor(w*h/1e6);
      const sheets=parseInt(g('_sheets').value)||12;
      const rows=[
        {label:`Печать блока (${sheets} л.)`,v:sheets*PAPER()[g('_paper').value]*COLOR()[g('_color').value]*sf},
        {label:'Обложка',v:PAPER()[g('_covpaper').value]*COLOR()[g('_covcolor').value]*sf},
        {label:'Сборка/крепеж',v:desk?C.deskBase:C.flipBase}
      ];
      if(desk){
        rows.push({label:'Основание ('+g('_basepaper').value+')',v:PAPER()[g('_basepaper').value]*sf});
        const lam=getLamination(p);
        if(lam.sum) rows.push({label:lam.name,v:lam.sum});
      } else {
        const pt=getPostTreatmentTotal(p);
        if(pt.sum) rows.push({label:'Отделка ('+pt.names.join(', ')+')',v:pt.sum});
      }
      return rows;
    }
    if(type==='Квартальный'){
      const sm=C.quarterSize[g('_size').value];
      const fields=parseInt(g('_fields').value)||3;
      return [
        {label:`Печать полей (${fields})`,v:fields*PAPER()[g('_paper').value]*COLOR()[g('_color').value]*C.quarterFieldFactor*sm},
        {label:'Блок и крепление',v:C.quarterBase*sm}
      ];
    }
    if(type==='Карманный'){
      const sf=factor(areaFromFormat(C.pocketFormat));
      const rows=[{label:'Печать',v:Math.max(PAPER()[g('_paper').value]*COLOR()[g('_color').value]*sf,C.pocketMinPrint)}];
      if(g('_round_chk').checked) rows.push({label:'Скругление углов',v:C.pocketRound});
      const lam=getLamination(p);
      if(lam.sum) rows.push({label:lam.name,v:lam.sum});
      return rows;
    }
    const faces=parseInt(g('_faces').value)||4;
    const mountName=g('_mount').value;
    return [
      {label:`Печать граней (${faces})`,v:faces*PAPER()[g('_paper').value]*COLOR()[g('_color').value]*factor(C.pyramidFaceArea)*C.pyramidPrintFactor},
      {label:'Основание/сборка',v:C.pyramidBase},
      {label:'Крепление ('+mountName+')',v:C.pyramidMount[mountName]}
    ];
  });
}

/* ===================== РЕДАКТОР ЦЕН ===================== */
function deepAssign(t,s){
  for(const k in s){
    if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object') deepAssign(t[k],s[k]);
    else t[k]=s[k];
  }
}
const savePrices=()=>localStorage.setItem('printcalc_prices_v2',JSON.stringify(PRICES));
(function(){
  try{ const s=localStorage.getItem('printcalc_prices_v2'); if(s) deepAssign(PRICES,JSON.parse(s)); }catch(e){}
})();

function renderPrices(){
  const skip=['colorLists','paperLists','offsetTable'];
  let html='';
  function walk(obj,path,title){
    const leaves=[];
    for(const k in obj){
      const v=obj[k], pth=path.concat(k);
      if(typeof v==='number') leaves.push([k,pth,v]);
      else if(Array.isArray(v)){
        v.forEach((it,i)=>{
          if(it&&typeof it==='object'){
            for(const key in it){
              if(typeof it[key]!=='number'||key==='from'||key==='to') continue;
              const base=it.name||(it.from===it.to?it.from+' шт.':'от '+it.from+' до '+it.to+' шт.');
              const suffix={price:'',mult:' (×)',c40:' — 4+0',c44:' — 4+4'}[key]??(' ('+key+')');
              leaves.push([base+suffix,pth.concat(i,key),it[key]]);
            }
          }
        });
      }
      else if(v&&typeof v==='object') walk(v,pth,title+' / '+k);
    }
    if(leaves.length) html+=`<div class="block-title">${title}</div><div class="grid2">`+
      leaves.map(([n,pp,v])=>`<div class="field"><label>${n}</label><input type="number" step="any" value="${v}" data-path='${JSON.stringify(pp)}'></div>`).join('')+`</div>`;
  }
  for(const k in PRICES){
    if(skip.includes(k)) continue;
    const v=PRICES[k];
    if(typeof v==='number') walk({[k]:v},[],'Общее'); else walk(v,[k],k);
  }
  panel.innerHTML=`
    <div class="panel-head"><div><h1>Цены</h1><p>Изменения сохраняются в браузере автоматически</p></div></div>
    <hr class="divider">
    ${html}
    <div class="block-title">JSON цен</div>
    <textarea id="pr_json" style="width:100%;height:260px;font-family:monospace;font-size:12px;border:1.5px solid var(--line);border-radius:10px;padding:12px"></textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="submit-btn" id="pr_show" style="background:var(--ink)">Обновить JSON</button>
      <button class="submit-btn" id="pr_apply">Применить JSON</button>
      <button class="submit-btn" id="pr_copy" style="background:var(--ink)">Копировать</button>
      <button class="submit-btn" id="pr_reset" style="background:#c0392b">Сбросить цены</button>
    </div>`;
  const ta=$('pr_json');
  const show=()=>{ta.value=JSON.stringify(PRICES,null,2);};
  panel.querySelectorAll('input[data-path]').forEach(inp=>inp.addEventListener('input',()=>{
    const path=JSON.parse(inp.dataset.path); let o=PRICES;
    for(let i=0;i<path.length-1;i++) o=o[path[i]];
    const val=parseFloat(inp.value); if(isNaN(val)) return;
    o[path[path.length-1]]=val;
    savePrices();show();
  }));
  $('pr_show').onclick=show;
  $('pr_apply').onclick=()=>{
    try{deepAssign(PRICES,JSON.parse(ta.value));savePrices();renderPrices();}
    catch(e){alert('Ошибка JSON: '+e.message);}
  };
  $('pr_copy').onclick=()=>{show();navigator.clipboard.writeText(ta.value);};
  $('pr_reset').onclick=()=>{if(confirm('Сбросить все цены к значениям по умолчанию?')){localStorage.removeItem('printcalc_prices_v2');location.reload();}};
  show();
}
