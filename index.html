<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прайс-калькулятор | Типография</title>
<style>
:root{
  --ink:#10231c;
  --accent:#0f9d78;
  --accent-dark:#0b7a5d;
  --accent-soft:#e3f7ef;
  --paper:#fbfaf6;
  --card:#ffffff;
  --line:#e4e1d6;
  --muted:#8b8a7f;
  --warn:#c77b2e;
  --radius:14px;
  --shadow:0 10px 30px rgba(16,35,28,.08);
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  background:
    radial-gradient(circle at 10% 0%, #eef8f2 0, transparent 45%),
    radial-gradient(circle at 90% 100%, #f5efe2 0, transparent 50%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
}
.shell{
  max-width:1120px;
  margin:28px auto;
  display:grid;
  grid-template-columns:230px 1fr;
  gap:22px;
  padding:0 16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 4px 18px;
}
.brand .logo{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:18px;
}
.brand .name{font-weight:700;font-size:16px;line-height:1.1;}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.04em;}

.sidenav{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px 12px;
  height:fit-content;
  position:sticky;
  top:24px;
}
.nav-scroll{
  display:flex;
  flex-direction:column;
  gap:4px;
  max-height:70vh;
  overflow-y:auto;
  padding-right:4px;
}
.nav-scroll::-webkit-scrollbar{width:5px;}
.nav-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.nav-item{
  border:none;
  background:none;
  text-align:left;
  padding:11px 14px;
  border-radius:10px;
  font-size:14.5px;
  color:#4c4b43;
  cursor:pointer;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:10px;
  transition:background .15s, color .15s;
}
.nav-item .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--line);
  flex:0 0 auto;
}
.nav-item:hover{background:var(--accent-soft);}
.nav-item.active{
  background:var(--ink);
  color:#fff;
  font-weight:700;
}
.nav-item.active .dot{background:var(--accent);}

.panel{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:30px 34px 38px;
}
.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:16px;
  margin-bottom:22px;
}
.panel-head h1{
  font-size:24px;
  margin:0;
  letter-spacing:-.01em;
}
.panel-head p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13.5px;
}
.mode-toggle{
  display:inline-flex;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  gap:2px;
}
.mode-toggle button{
  border:none;
  background:none;
  padding:9px 18px;
  border-radius:999px;
  font-size:13.5px;
  font-weight:600;
  color:var(--muted);
  cursor:pointer;
}
.mode-toggle button.active{
  background:var(--ink);
  color:#fff;
}
.divider{
  border:none;
  height:1px;
  background:var(--line);
  margin:0 0 26px;
}
.block-title{
  text-transform:uppercase;
  font-size:11.5px;
  letter-spacing:.09em;
  color:var(--accent-dark);
  font-weight:700;
  margin:30px 0 16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.block-title::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--line);
}
.field{margin-bottom:20px;}
.field > label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:9px;
  color:var(--ink);
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;}
  .sidenav{position:static;}
  .nav-scroll{max-height:none; flex-direction:row; flex-wrap:wrap;}
  .grid2, .grid3{grid-template-columns:1fr 1fr;}
}
select, input[type=number], input[type=text]{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1.5px solid var(--line);
  font-size:14.5px;
  color:var(--ink);
  background:var(--paper);
  outline:none;
  font-family:inherit;
}
select:focus, input:focus{
  border-color:var(--accent);
  background:#fff;
}
.chips{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.chip{
  padding:10px 18px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:var(--paper);
  cursor:pointer;
  font-size:14px;
  color:#4c4b43;
  font-weight:600;
}
.chip.active{
  border-color:var(--accent);
  background:var(--ink);
  color:#fff;
}
.qty-box input{margin-bottom:10px;}
.qty-chips{display:flex;gap:8px;flex-wrap:wrap;}
.qty-chips button{
  padding:9px 15px;
  border-radius:8px;
  border:1.5px dashed var(--line);
  background:#fff;
  cursor:pointer;
  font-size:13.5px;
  color:#4c4b43;
  font-weight:600;
}
.qty-chips button.active{
  border-style:solid;
  border-color:var(--accent);
  color:var(--accent-dark);
  background:var(--accent-soft);
}
.switch-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin:20px 0;
  cursor:pointer;
  user-select:none;
}
.switch{
  width:42px;height:24px;border-radius:999px;
  background:var(--line);
  position:relative;
  transition:background .2s;
  flex:0 0 auto;
}
.switch::after{
  content:'';
  position:absolute;
  width:18px;height:18px;border-radius:50%;
  background:#fff;top:3px;left:3px;
  transition:left .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.switch-row input{display:none;}
.switch-row input:checked + .switch{background:var(--accent);}
.switch-row input:checked + .switch::after{left:21px;}
.switch-row .stxt{font-size:14.5px;font-weight:600;}
.sub-options{
  display:none;
  margin:0 0 18px 54px;
  padding:14px 16px;
  background:var(--paper);
  border:1px dashed var(--line);
  border-radius:10px;
}
.sub-options.show{display:block;}
.sub-options label{
  display:flex;align-items:center;gap:9px;
  font-size:13.5px;font-weight:500;margin-bottom:9px;cursor:pointer;
}
.sub-options label:last-child{margin-bottom:0;}
.note{
  background:var(--accent-soft);
  border-radius:10px;
  padding:14px 16px;
  font-size:13.5px;
  color:#2d5c48;
  margin:10px 0 22px;
}
.note b{color:var(--ink);}
.custom-dim{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:12px;
}
.custom-dim.show{display:grid;}
.type-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
@media (max-width:760px){ .type-cards{grid-template-columns:repeat(2,1fr);} }
.type-card{
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:16px 8px 12px;
  text-align:center;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  color:#4c4b43;
  background:#fff;
}
.type-card .ico{
  width:36px;height:36px;margin:0 auto 10px;
  border-radius:9px;
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
}
.type-card.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--accent-dark);
}
.type-card.active .ico{background:var(--accent);color:#fff;}
.submit-btn{
  margin-top:14px;
  background:var(--accent);
  color:#fff;
  border:none;
  padding:15px 34px;
  border-radius:999px;
  font-size:15.5px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(15,157,120,.3);
}
.submit-btn:hover{background:var(--accent-dark);}
.result{
  margin-top:30px;
  border-radius:14px;
  overflow:hidden;
  border:1.5px solid var(--line);
  display:none;
}
.result.show{display:block;}
.result-header{
  background:var(--ink);
  color:#fff;
  padding:16px 22px;
  font-size:15.5px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.result-header span.tag{
  background:var(--accent);
  font-size:11.5px;
  padding:4px 10px;
  border-radius:999px;
  font-weight:700;
}
.result-body{padding:18px 22px 6px;background:#fff;}
.rline{
  display:flex;justify-content:space-between;
  padding:9px 0;
  font-size:14px;
  border-bottom:1px solid #f0efe8;
}
.rline:last-child{border-bottom:none;}
.rline .v{font-weight:700;}
.result-total{
  background:var(--accent-soft);
  padding:18px 22px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:19px;font-weight:800;color:var(--accent-dark);
}
table.urg{
  width:100%;border-collapse:collapse;
}
table.urg th, table.urg td{
  text-align:left;padding:12px 10px;font-size:13.5px;
  border-bottom:1px solid #f0efe8;
}
table.urg th{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.05em;}
table.urg tr.pick td{font-weight:700;color:var(--accent-dark);background:var(--accent-soft);}
</style>
</head>
<body>

<div class="shell">
  <div>
    <div class="brand">
      <div class="logo">Т</div>
      <div>
        <div class="name">PrintCalc</div>
        <div class="sub">расчёт полиграфии</div>
      </div>
    </div>
    <div class="sidenav">
      <div class="nav-scroll" id="nav"></div>
    </div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<script>
/* ===================== ДАННЫЕ / ПРАЙС ===================== */

const PAPER_PRICES = {
  "Офисная (офсет) 80 г/кв.м": 1.2,
  "Офсетная 120 г/кв.м": 1.8,
  "Глянцевая бумага 130 г/кв.м": 2.2,
  "Глянцевая бумага 150 г/кв.м": 2.6,
  "Матовая бумага 150 г/кв.м": 2.6,
  "Глянцевая бумага 170 г/кв.м": 3.0,
  "Мелованная бумага 200 г/кв.м": 3.6,
  "Мелованная бумага 250 г/кв.м": 4.4,
  "Картон глянцевый 300 г/кв.м": 5.5,
  "Картон матовый 300 г/кв.м": 5.5,
  "Крафт-бумага 120 г/кв.м": 2.0,
  "Самоклеящаяся бумага": 6.5,
  "Пленка ПВХ (прозрачная)": 7.0
};

const COLOR_MULT = {
  "Без печати": 0,
  "Черно-белая": 1,
  "Черно-белая с одной стороны (1+0)": 1,
  "Черно-белая с двух сторон (1+1)": 1.6,
  "Цветная с одной стороны (4+0)": 2.4,
  "Цветная с двух сторон (4+4)": 4,
  "Цветная снаружи": 2.4,
  "Цветная с двух сторон": 4
};

const fmt = n => n.toLocaleString('ru-RU', {maximumFractionDigits:0}) + ' ₽';

/* ===================== UI-ХЕЛПЕРЫ ===================== */

function selectField(id, label, options, def){
  return `<div class="field">
    <label>${label}</label>
    <select id="${id}">
      ${options.map(o=>`<option value="${o}" ${o===def?'selected':''}>${o}</option>`).join('')}
    </select>
  </div>`;
}

function chipGroup(id, label, options, def){
  return `<div class="field">
    <label>${label}</label>
    <div class="chips" id="${id}">
      ${options.map(o=>`<button type="button" class="chip ${o===def?'active':''}" data-val="${o}">${o}</button>`).join('')}
    </div>
  </div>`;
}

function qtyField(id){
  return `<div class="field qty-box">
    <label>Тираж, шт.</label>
    <input type="number" id="${id}" min="1" placeholder="0" value="">
    <div class="qty-chips" id="${id}_presets">
      ${[100,200,300,500,1000].map(v=>`<button type="button" data-val="${v}">${v}</button>`).join('')}
    </div>
  </div>`;
}

function postTreatmentBlock(id, items){
  return `
  <label class="switch-row" id="${id}_label">
    <input type="checkbox" id="${id}_chk">
    <span class="switch"></span>
    <span class="stxt">Послепечатная обработка</span>
  </label>
  <div class="sub-options" id="${id}_box">
    ${items.map(it=>`<label><input type="checkbox" class="pt_${id}" value="${it.price}" data-name="${it.name}">${it.name} <span style="color:#8b8a7f">(+${it.price} ₽/изд.)</span></label>`).join('')}
  </div>`;
}

function modeToggle(prefix){
  return `<div class="mode-toggle">
    <button type="button" class="active" id="${prefix}_seg_qty">По тиражам</button>
    <button type="button" id="${prefix}_seg_urg">По срочности</button>
  </div>`;
}

function wireChips(id){
  document.querySelectorAll(`#${id} .chip`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll(`#${id} .chip`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      btn.dispatchEvent(new CustomEvent('chipchange', {bubbles:true}));
    });
  });
}
function getChipVal(id){
  const el = document.querySelector(`#${id} .chip.active`);
  return el ? el.dataset.val : null;
}
function wireQty(id){
  const input = document.getElementById(id);
  document.querySelectorAll(`#${id}_presets button`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll(`#${id}_presets button`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      input.value = btn.dataset.val;
    });
  });
  input.addEventListener('input', ()=>{
    document.querySelectorAll(`#${id}_presets button`).forEach(b=>b.classList.remove('active'));
  });
}
function wirePostTreatment(id){
  const chk = document.getElementById(id+'_chk');
  const box = document.getElementById(id+'_box');
  chk.addEventListener('change', ()=> box.classList.toggle('show', chk.checked));
}
function getPostTreatmentTotal(id){
  let sum = 0, names=[];
  document.querySelectorAll(`.pt_${id}:checked`).forEach(c=>{
    sum += parseFloat(c.value);
    names.push(c.dataset.name);
  });
  return {sum, names};
}
function wireMode(prefix, onChange){
  const qtyBtn = document.getElementById(prefix+'_seg_qty');
  const urgBtn = document.getElementById(prefix+'_seg_urg');
  qtyBtn.addEventListener('click', ()=>{
    qtyBtn.classList.add('active'); urgBtn.classList.remove('active');
    onChange('qty');
  });
  urgBtn.addEventListener('click', ()=>{
    urgBtn.classList.add('active'); qtyBtn.classList.remove('active');
    onChange('urgency');
  });
}

function areaFromFormat(fmtStr, customW, customH){
  const sizes = {
    "A5 (148x210)":[148,210],
    "A4 (210x297)":[210,297],
    "A6 (105x148)":[105,148],
    "A3 (297x420)":[297,420],
    "90x50 мм":[90,50],
    "85x55 мм":[85,55],
    "Евробуклет (99x210)":[297,210]
  };
  let w,h;
  if(sizes[fmtStr]){ [w,h]=sizes[fmtStr]; }
  else { w=customW||210; h=customH||297; }
  return (w*h)/1000000;
}

/* ===================== СПИСОК ТОВАРОВ ===================== */

const TABS = [
  {id:'brochures', name:'Брошюры', icon:'📘', render: renderBrochures},
  {id:'booklets', name:'Буклеты', icon:'📑', render: renderBooklets},
  {id:'cards', name:'Визитки', icon:'🪪', render: renderCards},
  {id:'books', name:'Книги', icon:'📕', render: renderBooks},
  {id:'flyers', name:'Листовки', icon:'📄', render: renderFlyers},
  {id:'posters', name:'Плакаты', icon:'🖼️', render: renderPosters},
  {id:'calendars', name:'Календари', icon:'📅', render: renderCalendars},
  {id:'stickers', name:'Наклейки', icon:'🏷️', render: renderStickers},
  {id:'notepads', name:'Блокноты', icon:'📓', render: renderNotepads},
  {id:'letterheads', name:'Бланки', icon:'🧾', render: renderLetterheads},
];

const nav = document.getElementById('nav');
TABS.forEach((t,i)=>{
  const btn = document.createElement('button');
  btn.className='nav-item'+(i===0?' active':'');
  btn.innerHTML = `<span class="dot"></span>${t.icon} ${t.name}`;
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    t.render();
  });
  nav.appendChild(btn);
});

const panel = document.getElementById('panel');

function panelShell(prefix, title, subtitle, innerHtml){
  return `
  <div class="panel-head">
    <div>
      <h1>${title}</h1>
      <p>${subtitle}</p>
    </div>
    ${modeToggle(prefix)}
  </div>
  <hr class="divider">
  ${innerHtml}`;
}

function urgencyResultHtml(prefix){
  return `<div class="result" id="${prefix}_result">
    <div class="result-header"><span>Сроки изготовления</span><span class="tag">по срочности</span></div>
    <div class="result-body" style="padding-bottom:18px;">
      <table class="urg">
        <thead><tr><th>Срочность</th><th>Срок</th><th>Наценка</th><th>Стоимость</th></tr></thead>
        <tbody id="${prefix}_urg_body"></tbody>
      </table>
    </div>
  </div>`;
}
function qtyResultHtml(prefix){
  return `<div class="result" id="${prefix}_result">
    <div class="result-header"><span>Результат расчёта</span><span class="tag">по тиражу</span></div>
    <div class="result-body" id="${prefix}_rows"></div>
    <div class="result-total"><span>Итого к оплате</span><span id="${prefix}_total">0 ₽</span></div>
  </div>`;
}
function showUrgencyResult(prefix, baseTotal){
  const panelEl = document.getElementById(prefix+'_result');
  const body = document.getElementById(prefix+'_urg_body');
  const levels = [
    {name:'Стандарт', days:'3–5 дней', mult:1},
    {name:'Срочно', days:'1–2 дня', mult:1.3},
    {name:'Экспресс', days:'в течение суток', mult:1.6},
    {name:'Супер-срочно', days:'от 4 часов', mult:2.0},
  ];
  body.innerHTML = levels.map((l,i)=>`<tr class="${i===0?'pick':''}">
    <td>${l.name}</td><td>${l.days}</td><td>${l.mult===1?'—':'+'+Math.round((l.mult-1)*100)+'%'}</td><td>${fmt(baseTotal*l.mult)}</td>
  </tr>`).join('');
  panelEl.classList.add('show');
}
function showQtyResult(prefix, rows, total){
  const panelEl = document.getElementById(prefix+'_result');
  document.getElementById(prefix+'_rows').innerHTML = rows.map(r=>
    `<div class="rline"><span>${r.label}</span><span class="v">${r.value}</span></div>`
  ).join('');
  document.getElementById(prefix+'_total').textContent = fmt(total);
  panelEl.classList.add('show');
}

/* ===================== БРОШЮРЫ ===================== */
function renderBrochures(){
  const p='bro';
  panel.innerHTML = panelShell(p, 'Брошюры', 'Многостраничные издания со скреплением', `
    ${selectField(p+'_bind','Вид переплета (сборки)', ['На скрепку','На клей (КБС)','На пружину'], 'На скрепку')}
    ${chipGroup(p+'_fmt','Формат брошюры', ['A5 (148x210)','A4 (210x297)','Свой размер (мм)'], 'A5 (148x210)')}
    <div class="custom-dim" id="${p}_custom">
      <div class="field"><label>Ширина, мм</label><input type="number" id="${p}_w" value="148"></div>
      <div class="field"><label>Высота, мм</label><input type="number" id="${p}_h" value="210"></div>
    </div>
    <div class="block-title">Внутренний блок</div>
    <div class="grid2">
      <div class="field"><label>Количество страниц</label><input type="number" id="${p}_pages" placeholder="0" min="4" step="4" value="16"></div>
      ${selectField(p+'_incolor','Печать (цветность)', Object.keys(COLOR_MULT).slice(0,5), 'Цветная с двух сторон (4+4)')}
    </div>
    ${selectField(p+'_inpaper','Материал', Object.keys(PAPER_PRICES), 'Глянцевая бумага 130 г/кв.м')}
    <div class="block-title">Обложка</div>
    <div class="grid2">
      ${selectField(p+'_covcolor','Печать (цветность)', Object.keys(COLOR_MULT).slice(0,5), 'Цветная с одной стороны (4+0)')}

      <div class="type-cards" id="${p}_type" style="grid-template-columns:repeat(5,1fr);">
        ${[
          ['📅','Перекидной'],
          ['🗓️','Квартальный'],
          ['📆','Настольный'],
          ['🧮','Карманный'],
          ['🔺','Пирамидка']
        ].map((t,i)=>`<div class="type-card ${i===0?'active':''}" data-val="${t[1]}"><span class="ico">${t[0]}</span>${t[1]}</div>`).join('')}
      </div>
    </div>
    <div id="${p}_dynamic"></div>
    <button class="submit-btn" id="${p}_calc">Рассчитать стоимость</button>
    ${qtyResultHtml(p)}
    ${urgencyResultHtml(p)}
  `);

  const dyn = document.getElementById(p+'_dynamic');

  function renderDynamic(type){
    if(type==='Перекидной' || type==='Настольный'){
      dyn.innerHTML = `
        ${selectField(p+'_fmt','Формат', ['A5 (148x210)','A4 (210x297)','A3 (297x420)'], 'A4 (210x297)')}
        <div class="grid2">
          <div class="field"><label>Количество листов</label><input type="number" id="${p}_sheets" value="12" min="1"></div>
          ${selectField(p+'_color','Печать блока (цветность)', ['Цветная с одной стороны (4+0)','Цветная с двух сторон (4+4)'], 'Цветная с одной стороны (4+0)')}
        </div>
        ${selectField(p+'_paper','Бумага блока', ['Мелованная бумага 200 г/кв.м','Мелованная бумага 250 г/кв.м'], 'Мелованная бумага 250 г/кв.м')}
        <div class="block-title">Обложка (как у брошюр)</div>
        <div class="grid2">
          ${selectField(p+'_covcolor','Печать обложки (цветность)', ['Цветная с одной стороны (4+0)','Цветная с двух сторон (4+4)'], 'Цветная с одной стороны (4+0)')}
          ${selectField(p+'_covpaper','Материал обложки', ['Картон глянцевый 300 г/кв.м','Картон матовый 300 г/кв.м','Мелованная бумага 250 г/кв.м'], 'Картон матовый 300 г/кв.м')}
        </div>
        ${postTreatmentBlock(p, [
          {name:'Ламинация глянец', price:4},
          {name:'Ламинация матовая', price:4.5},
          {name:'Ламинация софт тач', price:5.5}
        ])}
      `;
      wirePostTreatment(p);
    } else if(type==='Квартальный'){
      dyn.innerHTML = `
        ${selectField(p+'_size','Формат', ['Мини','Миди','Макси'], 'Миди')}
        <div class="grid2">
          <div class="field"><label>Количество печатных полей</label><input type="number" id="${p}_fields" value="3" min="1" max="6"></div>
          ${selectField(p+'_color','Печать (цветность)', ['Цветная с одной стороны (4+0)','Цветная с двух сторон (4+4)'], 'Цветная с одной стороны (4+0)')}
        </div>
        ${selectField(p+'_paper','Бумага', ['Мелованная бумага 200 г/кв.м','Мелованная бумага 250 г/кв.м','Картон глянцевый 300 г/кв.м'], 'Мелованная бумага 250 г/кв.м')}
      `;
    } else if(type==='Карманный'){
      dyn.innerHTML = `
        ${selectField(p+'_color','Печать (цветность)', ['Цветная с одной стороны (4+0)','Цветная с двух сторон (4+4)'], 'Цветная с двух сторон (4+4)')}
        ${selectField(p+'_paper','Материал', ['Картон глянцевый 300 г/кв.м','Картон матовый 300 г/кв.м'], 'Картон глянцевый 300 г/кв.м')}
        <label class="switch-row"><input type="checkbox" id="${p}_round_chk"><span class="switch"></span><span class="stxt">Скругление углов</span></label>
      `;
    } else if(type==='Пирамидка'){
      dyn.innerHTML = `
        ${selectField(p+'_color','Печать (цветность)', ['Цветная с одной стороны (4+0)','Цветная с двух сторон (4+4)'], 'Цветная с двух сторон (4+4)')}
        ${selectField(p+'_paper','Материал', ['Картон глянцевый 300 г/кв.м','Картон матовый 300 г/кв.м'], 'Картон матовый 300 г/кв.м')}
        <div class="field"><label>Количество граней (сменных вкладышей)</label><input type="number" id="${p}_faces" value="4" min="3" max="6"></div>
      `;
    }
  }

  renderDynamic('Перекидной');

  document.querySelectorAll(`#${p}_type .type-card`).forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll(`#${p}_type .type-card`).forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      renderDynamic(c.dataset.val);
      document.getElementById(p+'_result').classList.remove('show');
    });
  });

  let mode='qty';
  wireMode(p, (m)=>{ mode=m; document.getElementById(p+'_result').classList.remove('show'); });

  document.getElementById(p+'_calc').addEventListener('click', ()=>{
    const type = document.querySelector(`#${p}_type .type-card.active`).dataset.val;
    const qtyInput = document.getElementById(p+'_qty');
    // qty field is injected per-type below via a shared helper
    doCalc(type);
  });

  function injectQtyIfMissing(){
    if(!document.getElementById(p+'_qty')){
      const div = document.createElement('div');
      div.innerHTML = qtyField(p+'_qty');
      dyn.appendChild(div.firstElementChild);
      wireQty(p+'_qty');
    }
  }

  // ensure qty field always present: append once on each renderDynamic
  const originalRenderDynamic = renderDynamic;

  function doCalc(type){
    const qty = parseInt((document.getElementById(p+'_qty')||{}).value)||0;
    if(qty<=0){ alert('Укажите тираж'); return; }
    const a4area = 0.0624;
    let perUnit = 0;
    let rows = [];

    if(type==='Перекидной' || type==='Настольный'){
      const sizes = {'A5 (148x210)':[148,210],'A4 (210x297)':[210,297],'A3 (297x420)':[297,420]};
      const [w,h] = sizes[document.getElementById(p+'_fmt').value];
      const area = (w*h)/1000000;
      const sheetFactor = area/a4area;
      const sheets = parseInt(document.getElementById(p+'_sheets').value)||12;
      const color = COLOR_MULT[document.getElementById(p+'_color').value];
      const paper = PAPER_PRICES[document.getElementById(p+'_paper').value];
      const covColor = COLOR_MULT[document.getElementById(p+'_covcolor').value];
      const covPaper = PAPER_PRICES[document.getElementById(p+'_covpaper').value];
      const base = type==='Настольный' ? 8 : 5;
      const pt = getPostTreatmentTotal(p);

      const blockCost = sheets*paper*color*sheetFactor;
      const coverCost = covPaper*covColor*sheetFactor;
      perUnit = blockCost + coverCost + base + pt.sum;
      rows = [
        {label:'Блок ('+sheets+' л.)', value: null},
        {label:'Печать блока', value: '_blockCost'},
        {label:'Обложка', value: '_coverCost'},
        {label:'Сборка', value: '_base'},
        pt.sum? {label:'Отделка', value: '_pt'}: null
      ];
      rows = [
        {label:'Печать блока', key:'blockCost', v:blockCost},
        {label:'Обложка', key:'coverCost', v:coverCost},
        {label:'Сборка/крепеж', key:'base', v:base},
        pt.sum? {label:'Отделка', key:'pt', v:pt.sum}: null
      ].filter(Boolean);
    } else if(type==='Квартальный'){
      const sizeMult = {'Мини':0.6,'Миди':1,'Макси':1.6}[document.getElementById(p+'_size').value];
      const fields = parseInt(document.getElementById(p+'_fields').value)||3;
      const color = COLOR_MULT[document.getElementById(p+'_color').value];
      const paper = PAPER_PRICES[document.getElementById(p+'_paper').value];
      const printCost = fields*paper*color*0.5*sizeMult;
      const blockBase = 6*sizeMult;
      perUnit = printCost + blockBase;
      rows = [
        {label:'Печать полей ('+fields+')', key:'print', v:printCost},
        {label:'Блок и крепление', key:'base', v:blockBase}
      ];
    } else if(type==='Карманный'){
      const color = COLOR_MULT[document.getElementById(p+'_color').value];
      const paper = PAPER_PRICES[document.getElementById(p+'_paper').value];
      const area = areaFromFormat('90x50 мм');
      const sheetFactor = area/a4area;
      const printCost = paper*color*sheetFactor;
      const round = document.getElementById(p+'_round_chk').checked ? 0.3 : 0;
      perUnit = Math.max(printCost,0.6) + round;
      rows = [
        {label:'Печать', key:'print', v:printCost},
        round? {label:'Скругление углов', key:'round', v:round}: null
      ].filter(Boolean);
    } else if(type==='Пирамидка'){
      const color = COLOR_MULT[document.getElementById(p+'_color').value];
      const paper = PAPER_PRICES[document.getElementById(p+'_paper').value];
      const faces = parseInt(document.getElementById(p+'_faces').value)||4;
      const area = 0.012; // площадь одной грани, усреднённо
      const sheetFactor = area/a4area;
      const printCost = faces*paper*color*sheetFactor*4;
      const base = 12;
      perUnit = printCost + base;
      rows = [
        {label:'Печать граней ('+faces+')', key:'print', v:printCost},
        {label:'Основание/сборка', key:'base', v:base}
      ];
    }

    const discount = qty>=1000?0.8: qty>=500?0.88: qty>=300?0.93: qty>=200?0.96:1;
    const total = perUnit*qty*discount;

    const displayRows = rows.map(r=>({label:r.label, value: fmt(r.v*qty*discount)}));
    displayRows.push({label:'Тираж', value: qty+' шт.'});
    displayRows.push({label:'Цена за штуку', value: fmt(total/qty)});

    if(mode==='qty'){
      showQtyResult(p, displayRows, total);
    } else {
      showUrgencyResult(p, total);
    }
  }

  // append qty field for the first render
  (function ensureQty(){
    const div = document.createElement('div');
    div.innerHTML = qtyField(p+'_qty');
    dyn.appendChild(div.firstElementChild);
    wireQty(p+'_qty');
  })();

  // re-append qty field whenever type changes (since dyn.innerHTML resets)
  document.querySelectorAll(`#${p}_type .type-card`).forEach(c=>{
    c.addEventListener('click', ()=>{
      const div = document.createElement('div');
      div.innerHTML = qtyField(p+'_qty');
      dyn.appendChild(div.firstElementChild);
      wireQty(p+'_qty');
    });
  });
}

/* ===================== НАКЛЕЙКИ ===================== */
function renderStickers(){
  const p='stk';
  panel.innerHTML = panelShell(p, 'Наклейки', 'Самоклеящаяся продукция любой формы', `
    <div class="grid2">
      ${selectField(p+'_shape','Форма наклейки', ['Прямоугольная','Круглая','Овальная','Фигурная (по контуру)'], 'Прямоугольная')}
      ${selectField(p+'_color','Печать (цветность)', ['Цветная с одной стороны (4+0)'], 'Цветная с одной стороны (4+0)')}
    </div>
    <div class="grid2">
      <div class="field"><label>Ширина, мм</label><input type="number" id="${p}_w" value="50"></div>
      <div class="field"><label>Высота, мм</label><input type="number" id="${p}_h" value="50"></div>
    </div>
    ${selectField(p+'_paper','Материал', ['Самоклеящаяся бумага','Пленка ПВХ (прозрачная)'], 'Самоклеящаяся бумага')}
    ${qtyField(p+'_qty')}
    <label class="switch-row"><input type="checkbox" id="${p}_lam_chk"><span class="switch"></span><span class="stxt">Ламинация (защитный слой)</span></label>
    <button class="submit-btn" id="${p}_calc">Рассчитать стоимость</button>
    ${qtyResultHtml(p)}
    ${urgencyResultHtml(p)}
  `);
  wireQty(p+'_qty');

  let mode='qty';
  wireMode(p, (m)=>{ mode=m; document.getElementById(p+'_result').classList.remove('show'); });

  document.getElementById(p+'_calc').addEventListener('click', ()=>{
    const qty = parseInt(document.getElementById(p+'_qty').value)||0;
    if(qty<=0){ alert('Укажите тираж'); return; }
    const w = parseFloat(document.getElementById(p+'_w').value)||50;
    const h = parseFloat(document.getElementById(p+'_h').value)||50;
    const area = (w*h)/1000000;
    const a4area=0.0624;
    const sheetFactor = area/a4area;
    const paper = PAPER_PRICES[document.getElementById(p+'_paper').value];
    const shape = document.getElementById(p+'_shape').value;
    const shapeExtra = shape==='Фигурная (по контуру)'?0.8: shape==='Круглая'||shape==='Овальная'?0.3:0;
    const lam = document.getElementById(p+'_lam_chk').checked?0.4:0;
    const printCost = paper*2.4*sheetFactor;
    const perUnit = Math.max(printCost,0.2) + shapeExtra + lam;
    const discount = qty>=5000?0.55: qty>=1000?0.7: qty>=500?0.82: qty>=200?0.92:1;
    const total = perUnit*qty*discount;

    if(mode==='qty'){
      showQtyResult(p, [
        {label:'Печать', value: fmt(printCost*qty*discount)},
        shapeExtra? {label:'Вырубка по форме', value: fmt(shapeExtra*qty*discount)}:null,
        lam? {label:'Ламинация', value: fmt(lam*qty*discount)}:null,
        {label:'Тираж', value: qty+' шт.'},
        {label:'Цена за штуку', value: fmt(total/qty)}
      ].filter(Boolean), total);
    } else {
      showUrgencyResult(p, total);
    }
  });
}

/* ===================== БЛОКНОТЫ ===================== */
function renderNotepads(){
  const p='npd';
  panel.innerHTML = panelShell(p, 'Блокноты', 'Блок на клею или пружине', `
    <div class="grid2">
      ${selectField(p+'_fmt','Формат блокнота', ['A6 (105x148)','A5 (148x210)','A4 (210x297)'], 'A5 (148x210)')}
      ${selectField(p+'_bind','Тип крепления', ['Склейка (блок на клею)','Пружина металлическая','Пружина пластиковая'], 'Склейка (блок на клею)')}
    </div>
    <div class="field" id="${p}_orient_field">
      <label>Ориентация пружины</label>
      <div class="chips" id="${p}_orient">
        <button type="button" class="chip active" data-val="Сверху">Сверху</button>
        <button type="button" class="chip" data-val="Сбоку">Сбоку</button>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>Кол-во листов</label><input type="number" id="${p}_sheets" value="50"></div>
      ${selectField(p+'_paper','Бумага блока', ['Офисная (офсет) 80 г/кв.м','Офсетная 120 г/кв.м'], 'Офисная (офсет) 80 г/кв.м')}
    </div>
    ${selectField(p+'_color','Красочность печати блока', ['Без печати','1+0 (черно-белая, 1 сторона)','4+0 (цветная, 1 сторона)','1+1 (черно-белая, 2 стороны)','4+4 (цветная, 2 стороны)'], '1+0 (черно-белая, 1 сторона)')}
    ${selectField(p+'_cover','Обложка', ['Картон глянцевый 300 г/кв.м','Картон матовый 300 г/кв.м'], 'Картон матовый 300 г/кв.м')}
    ${qtyField(p+'_qty')}
    <button class="submit-btn" id="${p}_calc">Рассчитать стоимость</button>
    ${qtyResultHtml(p)}
    ${urgencyResultHtml(p)}
  `);
  wireQty(p+'_qty');
  wireChips(p+'_orient');

  function toggleOrientVisibility(){
    const bind = document.getElementById(p+'_bind').value;
    document.getElementById(p+'_orient_field').style.display = bind==='Склейка (блок на клею)' ? 'none':'block';
  }
  document.getElementById(p+'_bind').addEventListener('change', toggleOrientVisibility);
  toggleOrientVisibility();

  let mode='qty';
  wireMode(p, (m)=>{ mode=m; document.getElementById(p+'_result').classList.remove('show'); });

  document.getElementById(p+'_calc').addEventListener('click', ()=>{
    const qty = parseInt(document.getElementById(p+'_qty').value)||0;
    if(qty<=0){ alert('Укажите тираж'); return; }
    const sizes = {'A6 (105x148)':[105,148],'A5 (148x210)':[148,210],'A4 (210x297)':[210,297]};
    const [w,h] = sizes[document.getElementById(p+'_fmt').value];
    const area=(w*h)/1000000;
    const a4area=0.0624;
    const sheetFactor=area/a4area;
    const sheets = parseInt(document.getElementById(p+'_sheets').value)||50;
    const paper = PAPER_PRICES[document.getElementById(p+'_paper').value];
    const cover = PAPER_PRICES[document.getElementById(p+'_cover').value];
    const bindVal = document.getElementById(p+'_bind').value;
    const bindPrice = {'Склейка (блок на клею)':10,'Пружина металлическая':25,'Пружина пластиковая':18}[bindVal];
    const colorMap = {
      'Без печати':0,
      '1+0 (черно-белая, 1 сторона)':1,
      '4+0 (цветная, 1 сторона)':2.4,
      '1+1 (черно-белая, 2 стороны)':1.6,
      '4+4 (цветная, 2 стороны)':4
    };
    const color = colorMap[document.getElementById(p+'_color').value];
    const orient = bindVal!=='Склейка (блок на клею)' ? getChipVal(p+'_orient') : null;
    const orientExtra = orient==='Сбоку' ? 2 : 0;

    const blockCost = sheets*paper*color*sheetFactor*0.5;
    const coverCost = cover*sheetFactor*2;
    const perUnit = blockCost + coverCost + bindPrice + orientExtra;
    const discount = qty>=1000?0.8: qty>=500?0.88: qty>=300?0.93: qty>=200?0.96:1;
    const total = perUnit*qty*discount;

    if(mode==='qty'){
      showQtyResult(p, [
        {label:'Блок (бумага+печать)', value: fmt(blockCost*qty*discount)},
        {label:'Обложка', value: fmt(coverCost*qty*discount)},
        {label:'Крепление ('+bindVal+(orient?', '+orient:'')+')', value: fmt((bindPrice+orientExtra)*qty*discount)},
        {label:'Тираж', value: qty+' шт.'},
        {label:'Цена за штуку', value: fmt(total/qty)}
      ], total);
    } else {
      showUrgencyResult(p, total);
    }
  });
}

      ].filter(Boolean), total);
    } else {
      showUrgencyResult(p, total);
    }
  });
}
